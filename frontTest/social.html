<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migopan - Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        migopanDark: '#0b0b16',
                        migopanCard: '#131324',
                        migopanCardBorder: '#292557',
                        migopanPurple: '#6d28d9',
                        migopanPurpleHover: '#5b21b6',
                        migopanInput: '#1b1b36',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-migopanDark text-white min-h-screen flex font-sans overflow-x-hidden">

    <!-- MENU LATERAL -->
    <aside class="w-64 bg-[#0e0e1d] border-r border-migopanCardBorder flex flex-col justify-between p-6 select-none">
        <div>
            <!-- Logo -->
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-orange-600 rounded-full flex items-center justify-center font-bold text-xl shadow-lg border-2 border-orange-400">
                    🐼
                </div>
                <span class="text-xl font-bold tracking-wide">Migopan</span>
            </div>

            <!-- Navegação -->
            <nav class="space-y-2">
                <a href="tarefas.html" class="flex items-center gap-3.5 py-3 px-4 rounded-2xl text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                    <i class="fa-solid fa-house"></i> Tarefas
                </a>
                <a href="#" class="flex items-center gap-3.5 py-3 px-4 rounded-2xl text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                    <i class="fa-regular fa-user"></i> Perfil
                </a>
                <a href="#" class="flex items-center gap-3.5 py-3 px-4 rounded-2xl text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                    <i class="fa-solid fa-paw"></i> Migo
                </a>
                <a href="social.html" class="flex items-center gap-3.5 py-3 px-4 rounded-2xl bg-migopanPurple text-white font-medium shadow-lg shadow-purple-900/30">
                    <i class="fa-solid fa-users"></i> Social
                </a>
                <a href="#" class="flex items-center gap-3.5 py-3 px-4 rounded-2xl text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                    <i class="fa-solid fa-layer-group"></i> Grupos
                </a>
                <a href="#" class="flex items-center gap-3.5 py-3 px-4 rounded-2xl text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                    <i class="fa-solid fa-store"></i> Loja
                </a>
                <a href="#" class="flex items-center gap-3.5 py-3 px-4 rounded-2xl text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                    <i class="fa-solid fa-gear"></i> Ajustes
                </a>
            </nav>
        </div>

        <!-- Botão Sair -->
        <div>
            <button onclick="logout()" class="w-full flex items-center gap-3.5 py-3 px-4 rounded-2xl text-red-400 hover:bg-red-500/10 transition-colors font-medium">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
            </button>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 p-8 overflow-y-auto max-h-screen">
        
        <!-- CABEÇALHO DA PÁGINA -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-3xl font-bold">Amigos & Social</h1>
                    <span class="text-purple-400 text-xl">👥</span>
                </div>
                <p class="text-sm text-gray-400 mt-1">Conecte-se com outros pandas e cresçam juntos!</p>
            </div>

            <!-- Botão Adicionar Amigo -->
            <button onclick="abrirModalSolicitar()" class="bg-migopanPurple hover:bg-migopanPurpleHover text-white font-medium py-2.5 px-5 rounded-2xl shadow-lg transition-all flex items-center gap-2">
                <i class="fa-solid fa-user-plus text-xs"></i> Adicionar Amigo
            </button>
        </header>

        <!-- ABAS DE NAVEGAÇÃO INTERNA -->
        <div class="flex items-center gap-3 bg-migopanCard border border-migopanCardBorder p-2 rounded-2xl w-fit mb-6">
            <button onclick="mudarAba('amigos', this)" class="aba-btn px-4 py-2 rounded-xl text-xs font-medium bg-migopanPurple text-white transition-all">Meus Amigos</button>
            <button onclick="mudarAba('recebidas', this)" class="aba-btn px-4 py-2 rounded-xl text-xs font-medium text-gray-400 hover:text-white transition-all">Solicitações Recebidas</button>
            <button onclick="mudarAba('enviadas', this)" class="aba-btn px-4 py-2 rounded-xl text-xs font-medium text-gray-400 hover:text-white transition-all">Solicitações Enviadas</button>
        </div>

        <!-- CONTAINER DA LISTAGEM -->
        <div id="socialList" class="space-y-4 max-w-4xl">
            <!-- O JavaScript injeta os cards aqui de acordo com a aba selecionada -->
        </div>
    </main>

    <!-- MODAL ADICIONAR / PESQUISAR POR NOME -->
    <div id="modalSolicitar" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-migopanCard border border-migopanCardBorder rounded-3xl p-6 w-full max-w-lg shadow-2xl relative flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Adicionar Novo Amigo</h3>
                <button onclick="fecharModalSolicitar()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- Campo de Pesquisa por Nome -->
            <div class="relative mb-4">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="inputPesquisaNome" placeholder="Digite o nome do usuário..." oninput="pesquisarUsuarios()"
                    class="w-full bg-migopanInput border border-migopanCardBorder rounded-xl py-2.5 pl-9 pr-3 text-sm text-white focus:outline-none focus:border-purple-500">
            </div>

            <!-- Lista de Resultados da Pesquisa -->
            <div id="resultadoPesquisa" class="space-y-2.5 overflow-y-auto flex-1 pr-1">
                <p class="text-xs text-gray-500 text-center py-6">Digite um nome para começar a procurar...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8080/api/amigos';
        let abaAtual = 'amigos';

        async function carregarDadosSociais() {
            try {
                let endpoint = API_URL;
                if (abaAtual === 'recebidas') {
                    endpoint = `${API_URL}/pendentes/recebidas`;
                } else if (abaAtual === 'enviadas') {
                    endpoint = `${API_URL}/pendentes/enviadas`;
                }

                const response = await fetch(endpoint, {
                    method: 'GET',
                    mode: 'cors',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                const dados = await response.json();
                renderizarLista(dados);
            } catch (error) {
                console.error('Erro ao buscar dados sociais:', error);
            }
        }

        function renderizarLista(itens) {
            const container = document.getElementById('socialList');
            container.innerHTML = '';

            if (itens.length === 0) {
                let msg = 'Nenhum amigo encontrado.';
                if (abaAtual === 'recebidas') msg = 'Nenhuma solicitação recebida pendente.';
                if (abaAtual === 'enviadas') msg = 'Nenhuma solicitação enviada pendente.';

                container.innerHTML = `
                    <div class="bg-migopanCard border border-migopanCardBorder rounded-2xl p-8 text-center text-gray-400 text-sm">
                        ${msg}
                    </div>
                `;
                return;
            }

            itens.forEach(item => {
                const card = document.createElement('div');
                card.className = `bg-migopanCard border border-migopanCardBorder rounded-2xl p-4 flex items-center justify-between transition-all`;

                const amigoNome = item.amigo ? item.amigo.nome : 'Usuário';
                const amigoId = item.amigo ? item.amigo.id : '';

                let botoesAcao = '';

                if (abaAtual === 'amigos') {
                    botoesAcao = `
                        <span class="text-xs px-3 py-1 rounded-full bg-green-950 text-green-400 border border-green-900">Amigáveis</span>
                        <button onclick="removerAmizade(${amigoId})" class="text-gray-500 hover:text-red-400 transition-colors p-1" title="Remover Amizade">
                            <i class="fa-solid fa-user-minus text-xs"></i>
                        </button>
                    `;
                } else if (abaAtual === 'recebidas') {
                    botoesAcao = `
                        <div class="flex items-center gap-2">
                            <button onclick="atualizarStatus(${amigoId}, 'ACEITA')" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition-colors flex items-center gap-1">
                                <i class="fa-solid fa-check"></i> Aceitar
                            </button>
                            <button onclick="atualizarStatus(${amigoId}, 'RECUSADA')" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-900 px-3 py-1.5 rounded-xl text-xs font-medium transition-colors flex items-center gap-1">
                                <i class="fa-solid fa-xmark"></i> Recusar
                            </button>
                        </div>
                    `;
                } else if (abaAtual === 'enviadas') {
                    botoesAcao = `
                        <span class="text-xs px-3 py-1 rounded-full bg-yellow-950 text-yellow-400 border border-yellow-900">Pendente</span>
                        <button onclick="removerAmizade(${amigoId})" class="text-gray-500 hover:text-red-400 transition-colors p-1" title="Cancelar Solicitação">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    `;
                }

                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-migopanInput border border-migopanCardBorder rounded-full flex items-center justify-center font-bold text-purple-400">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-semibold text-white">${amigoNome}</h4>
                            <p class="text-xs text-gray-400 mt-0.5">ID: ${amigoId} ${item.dataAmizade ? '• ' + item.dataAmizade.replace('T', ' ') : ''}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        ${botoesAcao}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function mudarAba(aba, btnElement) {
            abaAtual = aba;
            document.querySelectorAll('.aba-btn').forEach(btn => {
                btn.classList.remove('bg-migopanPurple', 'text-white');
                btn.classList.add('text-gray-400');
            });
            btnElement.classList.add('bg-migopanPurple', 'text-white');
            btnElement.classList.remove('text-gray-400');
            carregarDadosSociais();
        }

        async function atualizarStatus(amigoId, status) {
            try {
                const response = await fetch(`${API_URL}/status/${amigoId}`, {
                    method: 'PATCH',
                    mode: 'cors',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });

                if (response.ok) {
                    carregarDadosSociais();
                } else {
                    console.error('Erro ao atualizar status da amizade');
                }
            } catch (error) {
                console.error('Erro de rede:', error);
            }
        }

        async function removerAmizade(amigoId) {
            if (!confirm('Deseja realmente remover esta amizade / solicitação?')) return;
            try {
                const response = await fetch(`${API_URL}/${amigoId}`, {
                    method: 'DELETE',
                    mode: 'cors',
                    credentials: 'include'
                });

                if (response.ok) {
                    carregarDadosSociais();
                } else {
                    console.error('Erro ao remover amizade');
                }
            } catch (error) {
                console.error('Erro de rede:', error);
            }
        }

        // Funções da Modal e Pesquisa por Nome
        function abrirModalSolicitar() {
            document.getElementById('modalSolicitar').classList.remove('hidden');
            document.getElementById('modalSolicitar').classList.add('flex');
            document.getElementById('inputPesquisaNome').value = '';
            document.getElementById('resultadoPesquisa').innerHTML = '<p class="text-xs text-gray-500 text-center py-6">Digite um nome para começar a procurar...</p>';
        }

        function fecharModalSolicitar() {
            document.getElementById('modalSolicitar').classList.remove('flex');
            document.getElementById('modalSolicitar').classList.add('hidden');
        }

        async function pesquisarUsuarios() {
            const nome = document.getElementById('inputPesquisaNome').value.trim();
            const container = document.getElementById('resultadoPesquisa');

            if (nome.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-500 text-center py-6">Digite um nome para começar a procurar...</p>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/pesquisar?nome=${encodeURIComponent(nome)}`, {
                    method: 'GET',
                    mode: 'cors',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) return;

                const usuarios = await response.json();
                container.innerHTML = '';

                if (usuarios.length === 0) {
                    container.innerHTML = '<p class="text-xs text-gray-500 text-center py-6">Nenhum usuário encontrado com esse nome.</p>';
                    return;
                }

                usuarios.forEach(user => {
                    const row = document.createElement('div');
                    row.className = 'bg-migopanInput border border-migopanCardBorder rounded-2xl p-3 flex items-center justify-between';
                    
                    row.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-migopanCard border border-migopanCardBorder rounded-full flex items-center justify-center font-bold text-purple-400 text-xs">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div>
                                <h5 class="text-xs font-semibold text-white">${user.nome}</h5>
                                <p class="text-[10px] text-gray-400">ID: ${user.id}</p>
                            </div>
                        </div>
                        <button onclick="enviarSolicitacao(${user.id})" class="bg-migopanPurple hover:bg-migopanPurpleHover text-white px-3 py-1.5 rounded-xl text-xs font-medium transition-all shadow-md flex items-center gap-1.5">
                            <i class="fa-solid fa-user-plus text-[10px]"></i> Adicionar
                        </button>
                    `;
                    container.appendChild(row);
                });

            } catch (error) {
                console.error('Erro na pesquisa:', error);
            }
        }

        async function enviarSolicitacao(amigoId) {
            try {
                const response = await fetch(`${API_URL}/solicitar/${amigoId}`, {
                    method: 'POST',
                    mode: 'cors',
                    credentials: 'include'
                });

                if (response.ok) {
                    fecharModalSolicitar();
                    alert('Solicitação enviada com sucesso!');
                    carregarDadosSociais();
                } else {
                    alert('Erro ao enviar solicitação (já enviada ou já são amigos).');
                }
            } catch (error) {
                console.error('Erro de rede:', error);
            }
        }

        async function logout() {
            await fetch('http://127.0.0.1:8080/api/auth/logout', { 
                method: 'POST', 
                mode: 'cors', 
                credentials: 'include' 
            });
            window.location.href = 'login.html';
        }

        // Inicializa carregando os amigos
        carregarDadosSociais();
    </script>
</body>
</html>
