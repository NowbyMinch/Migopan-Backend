<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migopan - Criar Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        migopanDark: '#0b0b16',
                        migopanCard: '#131324',
                        migopanCardBorder: '#292557',
                        migopanPurple: '#6d28d9',
                        migopanPurpleHover: '#5b21b6',
                        migopanInput: '#1b1b36',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-migopanDark text-white min-h-screen flex items-center justify-center font-sans p-4">

    <div class="bg-migopanCard border border-migopanCardBorder rounded-3xl p-8 w-full max-w-md shadow-2xl relative">
        <!-- Logo e Cabeçalho -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-orange-600 rounded-full flex items-center justify-center font-bold text-2xl shadow-lg border-2 border-orange-400 mx-auto mb-3">
                🐼
            </div>
            <h1 class="text-2xl font-bold">Crie sua conta</h1>
            <p class="text-xs text-gray-400 mt-1">Junte-se ao Migopan e organize sua rotina com estilo.</p>
        </div>

        <!-- Mensagens de Alerta -->
        <div id="alertaMsg" class="hidden text-xs p-3 rounded-xl mb-4 text-center"></div>

        <!-- Formulário de Cadastro -->
        <form id="formCadastro" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Nome</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fa-regular fa-user text-xs"></i>
                    </span>
                    <input type="text" id="nome" required placeholder="Seu nome completo"
                        class="w-full bg-migopanInput border border-migopanCardBorder rounded-xl py-2.5 pl-9 pr-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">E-mail</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fa-regular fa-envelope text-xs"></i>
                    </span>
                    <input type="email" id="email" required placeholder="seu@email.com"
                        class="w-full bg-migopanInput border border-migopanCardBorder rounded-xl py-2.5 pl-9 pr-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input type="password" id="senha" required placeholder="Mínimo de 6 caracteres"
                        class="w-full bg-migopanInput border border-migopanCardBorder rounded-xl py-2.5 pl-9 pr-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <button type="submit" class="w-full bg-migopanPurple hover:bg-migopanPurpleHover text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-purple-900/30 text-sm mt-2">
                Cadastrar
            </button>
        </form>

        <!-- Link para Login -->
        <p class="text-center text-xs text-gray-400 mt-6">
            Já tem uma conta? 
            <a href="login.html" class="text-purple-400 font-semibold hover:underline">Faça login</a>
        </p>
    </div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const alertaDiv = document.getElementById('alertaMsg');

            alertaDiv.className = 'hidden';

            try {
                const response = await fetch('http://127.0.0.1:8080/api/usuarios', {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });

                if (response.ok || response.status === 201) {
                    alertaDiv.textContent = 'Conta criada com sucesso! Redirecionando para o login...';
                    alertaDiv.className = 'bg-green-950/50 border border-green-800 text-green-300 text-xs p-3 rounded-xl mb-4 text-center';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alertaDiv.textContent = errorData.message || 'Erro ao criar conta. Verifique os dados.';
                    alertaDiv.className = 'bg-red-950/50 border border-red-800 text-red-300 text-xs p-3 rounded-xl mb-4 text-center';
                }
            } catch (error) {
                console.error('Erro de rede:', error);
                alertaDiv.textContent = 'Erro de conexão com o servidor.';
                alertaDiv.className = 'bg-red-950/50 border border-red-800 text-red-300 text-xs p-3 rounded-xl mb-4 text-center';
            }
        });
    </script>
</body>
</html>
