services:
  postgres-db:
    image: postgres:latest
    container_name: migopan-postgres
    environment:
      POSTGRES_DB: migopan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: minha_senha_secreta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: