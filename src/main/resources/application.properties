spring.application.name=api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/migopan_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:minha_senha_secreta}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Evita queries escondidas durante a serialização (exige JOIN FETCH nas relações LAZY)
spring.jpa.open-in-view=false

spring.flyway.enabled=true
# Removidos: clean-disabled=false e clean-on-validation-error=true (podiam apagar o banco)

# JWT e cookie
app.jwt.secret=${JWT_SECRET: migopan_chave_secreta_super_segura_para_jwt_123456789}
app.jwt.expiration-ms=86400000
app.cookie.secure=${COOKIE_SECURE:false}

# CORS: origens do front, separadas por vírgula
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500}

