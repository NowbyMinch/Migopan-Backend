<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Teste da API de Grupos</title>
  </head>
  <body>
    <h1>Gerenciador de Grupos</h1>

    <!-- Formulário para Criar Novo Grupo -->
    <form
      id="form-grupo"
      onsubmit="criarGrupo(event)"
      style="margin-bottom: 20px"
    >
      <h3>Novo Grupo</h3>
      <div>
        <input
          type="text"
          id="nome"
          placeholder="Nome do Grupo"
          required
          style="margin-right: 8px"
        />
        <input
          type="text"
          id="descricao"
          placeholder="Descrição (opcional)"
          style="margin-right: 8px"
        />
        <button type="submit">Adicionar Grupo</button>
      </div>
    </form>

    <hr />

    <form
      id="form-usuario"
      onsubmit="criarUsuario(event)"
      style="margin-bottom: 20px"
    >
      <h3>Novo Usuário</h3>
      <div>
        <input
          type="text"
          id="nomeUser"
          placeholder="Nome do Usuário"
          required
          style="margin-right: 8px"
        />
        <input
          type="email"
          id="email"
          placeholder="email"
          style="margin-right: 8px"
        />
        <input
          type="password"
          id="senha"
          placeholder="password"
          style="margin-right: 8px"
        />
        <button type="submit">Adicionar Usuário</button>
      </div>
    </form>

    <hr />

    <h2>Lista de Grupos</h2>
    <button onclick="carregarGrupos()">Atualizar Lista</button>
    <ul id="lista-grupos"></ul>

    <hr />

    <h2>Lista de Usuarios</h2>
    <button onclick="carregarUsuarios()">Atualizar Lista</button>
    <ul id="lista-usuarios"></ul>

    <script>
      const API_URL = "http://localhost:8080/api/groups";

      async function carregarGrupos() {
        const listaEl = document.getElementById("lista-grupos");
        listaEl.innerHTML = "Carregando...";

        try {
          const res = await fetch(API_URL);
          const data = await res.json();

          listaEl.innerHTML = "";

          if (!Array.isArray(data)) {
            listaEl.innerHTML = `<li><em>${data.message || data.message}</em></li>`;
            return;
          }

          data.forEach((grupo) => {
            const li = document.createElement("li");
            li.style.marginBottom = "8px";
            li.innerHTML = `
            <strong>[ID ${grupo.id}] ${grupo.nome}</strong>: ${grupo.descricao || "Sem descrição"}
            <button onclick="deletarGrupo(${grupo.id})" style="margin-left: 10px;">Deletar</button>
          `;
            listaEl.appendChild(li);
          });
        } catch (err) {
          listaEl.innerHTML =
            '<li style="color:red">Erro ao conectar com a API.</li>';
        }
      }

      async function criarGrupo(event) {
        event.preventDefault();

        const nomeInput = document.getElementById("nome");
        const descricaoInput = document.getElementById("descricao");

        const novoGrupo = {
          nome: nomeInput.value,
          descricao: descricaoInput.value,
        };

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(novoGrupo),
          });

          if (res.ok) {
            // Limpa os campos do formulário
            nomeInput.value = "";
            descricaoInput.value = "";
            // Atualiza a lista na tela
            carregarGrupos();
          } else {
            alert("Erro ao criar o grupo. Verifique os campos.");
          }
        } catch (err) {
          alert("Erro ao conectar com o servidor.");
        }
      }

      async function deletarGrupo(id) {
        await fetch(`${API_URL}/${id}`, { method: "DELETE" });
        carregarGrupos();
      }

      // Usuário ---------------------------------------------------------------------------------------------------------

      async function carregarUsuarios() {
        const listaEl = document.getElementById("lista-usuarios");
        listaEl.innerHTML = "Carregando...";

        try {
          const res = await fetch("http://localhost:8080/api/usuarios");
          const data = await res.json();

          listaEl.innerHTML = "";

          if (!Array.isArray(data)) {
            listaEl.innerHTML = `<li><em>${data.message || data.message}</em></li> <div>${data}</div>`;
            return;
          }

          data.forEach((usuario) => {
            const li = document.createElement("li");
            li.style.marginBottom = "8px";
            li.innerHTML = `
            <strong>[ID ${usuario.id}] ${usuario.nome}</strong>: ${usuario.email}
            <button onclick="deletarUsuario(${usuario.id})" style="margin-left: 10px;">Deletar</button>
          `;
            listaEl.appendChild(li);
          });
        } catch (err) {
          listaEl.innerHTML =
            '<li style="color:red">Erro ao conectar com a API.</li>';
        }
      }

      async function criarUsuario(event) {
        event.preventDefault();

        const nomeUserInput = document.getElementById("nomeUser");
        const emailInput = document.getElementById("email");
        const senhaInput = document.getElementById("senha");

        const novoUser = {
          nome: nomeUserInput.value,
          email: emailInput.value,
          senha: senhaInput.value,
        };

        try {
          const res = await fetch("http://localhost:8080/api/usuarios", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(novoUser),
          });
          const data = await res.json();

          if (res.ok) {
            // Limpa os campos do formulário
            nomeUserInput.value = "";
            emailInput.value = "";
            senhaInput.value = "";
            // Atualiza a lista na tela
            carregarUsuarios();
          } else {
            if (data && data.fieldErrors && Array.isArray(data.fieldErrors)) {
              const mensagensErros = data.fieldErrors
                .map((erro) => `- ${erro.field}: ${erro.message}`)
                .join("\n");

              alert(mensagensErros);
            }
          }
        } catch (err) {
          alert("Erro ao conectar com o servidor.");
        }
      }

      async function deletarUsuario(id) {
        await fetch(`${"http://localhost:8080/api/usuarios"}/${id}`, {
          method: "DELETE",
        });
        carregarUsuarios();
      }

      carregarGrupos();
      carregarUsuarios();
    </script>
  </body>
</html>
